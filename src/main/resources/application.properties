spring.application.name=ospan-ramazan-student-api
server.port=8080

app.student.name=Ramazan Ospan
app.student.group=IT2-2310

# PostgreSQL: in Docker Compose these values come from environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ospan_ramazan_students}
spring.datasource.username=${DB_USER:ospan_ramazan}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

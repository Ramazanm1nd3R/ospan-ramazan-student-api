# Jenkins configuration as code (Ramazan Ospan). Secrets come from environment variables, not from Git.
jenkins:
  systemMessage: "Jenkins of Ramazan Ospan (IT2-2310) - DevOps midterm"
  numExecutors: 2
  labelString: "docker"
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "ospan_ramazan"
          name: "Ramazan Ospan"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8090/"

tool:
  jdk:
    installations:
      - name: "jdk-21"
        home: "/opt/java/openjdk"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "ospan-ramazan-db"
              username: "ospan_ramazan"
              password: "${CI_DB_PASSWORD}"
              description: "PostgreSQL login for the Verify smoke test"

jobs:
  - script: |
      multibranchPipelineJob('Ospan_Ramazan_Student_API') {
        description('Student API of Ramazan Ospan (IT2-2310): Gradle build, tests, Docker image')
        branchSources {
          branchSource {
            source {
              git {
                id('ospan-ramazan-github')
                remote('https://github.com/Ramazanm1nd3R/ospan-ramazan-student-api.git')
                traits {
                  gitBranchDiscovery()
                  headWildcardFilter {
                    includes('main test/*')
                    excludes('')
                  }
                }
              }
            }
          }
        }
        orphanedItemStrategy {
          discardOldItems { numToKeep(10) }
        }
      }
